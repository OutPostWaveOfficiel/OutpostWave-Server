[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/gateway",
    "crates/channels",
    "crates/roles",
    "crates/messages",
    "crates/uploads",
    "crates/sfu",
    "crates/plugins",
    "crates/bots",
    "crates/moderation",
    "crates/ads-client",
    "crates/migration",
    "crates/bridges",
    "crates/server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/OutPostWaveOfficiel/OutpostWave-Server"
authors = ["OutpostWave contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
# FFI crates (capture, hardware codecs, shared memory) may opt in locally with #![allow(unsafe_code)].
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Small, fast binaries: performance is a core goal.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
# Optimize dependencies in dev builds (audio/video code is unusable unoptimized).
opt-level = 2
